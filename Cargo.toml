[package]
name = "mirl_values"
version = "0.0.0-alpha"
edition = "2024"
repository = "https://github.com/Miner3D-Gamer/mirl_values"
license.workspace = true
authors.workspace = true
rust-version.workspace = true
maintenance.workspace = true

[features]
all = [
    "all_codecs",
    "all_enum_extensions",
    "dep:toml",
    "dep:serde_json",
    "mirl_extensions/all",
    "mirl_values_core/all",
]
# Compatibility with ffi
c_compatible = ["mirl_extensions/c_compatible", "mirl_values_core/c_compatible"]
# Enables all codecs
all_codecs = [
    "dep:serde",
    "dep:bitcode",
    "dep:wincode",
    "dep:compactly",
    "dep:zerocopy",
    "mirl_values_core/all_codecs",
]
all_misc_integrations = ["rkyv", "get_size2", "bevy_reflect"]
# All enum extensions
all_enum_extensions = [
    "dep:strum",
    "dep:enum_ext",
    "mirl_values_core/all_enum_extensions",
    "enum_ordinalize",
]
# Codec stuff
serde = [
    "dep:serde",
    "mirl_values_core/serde",
    "bitcode?/serde",
    "num-bigfloat/serde",
    "num-bigint/serde",
    "toml?/serde",
]
bitcode = ["dep:bitcode", "mirl_values_core/bitcode"]
wincode = ["dep:wincode", "mirl_values_core/wincode"]
compactly = ["dep:compactly", "mirl_values_core/compactly"]
zerocopy = ["dep:zerocopy", "mirl_values_core/zerocopy"]
# Enum extensions
strum = ["dep:strum", "mirl_values_core/strum"]
enum_ext = ["dep:enum_ext", "mirl_values_core/enum_ext"]
# preserve_entries = ["mirl_values_core/preserve_entries"]
_checking = ["toml", "serde_json"]
# Support
toml = ["dep:toml", "mirl_values_core/toml"]
serde_json = ["dep:serde_json"]
serde_json_arbitrary_precision = [
    "serde_json",
    "serde_json?/arbitrary_precision",
]
enum_ordinalize = ["dep:enum-ordinalize", "mirl_values_core/enum_ordinalize"]
rkyv = ["dep:rkyv", "mirl_values_core/rkyv"]
parity_scale_codec = [
    "dep:parity-scale-codec",
    "mirl_values_core/parity_scale_codec",
]
get_size2 = ["dep:get-size2", "mirl_values_core/get_size2"]
bevy_reflect = ["dep:bevy_reflect", "mirl_values_core/bevy_reflect"]

[dependencies]
bitcode = { version = "0.6", optional = true, default-features = false, features = [
    "derive",
] }
# Codec
compactly = { version = "0.2", optional = true }
enum_ext = { version = "0.6", optional = true, default-features = false }
# lightningcss = { version = "1.0-alpha.71", optional = true }
mirl_macros = { version = "0.0.0-alpha" }
mirl_extensions = { version = "0.0.0-alpha", features = ["mirl_values"] }
mirl_values_core = { version = "0.0.0-alpha" }
num-bigfloat = { version = "1.7", default-features = false, features = [
    "std",
    "num-traits",
] }
# For the "dynamic" numbers
num-bigint = "0.5"
num-traits = { version = "0.2.19" }
serde = { version = "1.0", optional = true, default-features = false, features = [
    "derive",
] }
serde_json = { version = "1.0", optional = true }
# Enum functionality
strum = { version = "0.28", optional = true, default-features = false, features = [
    "derive",
] }
# # Settings# indexmap = { version = "1.0", optional = true }
# Support
toml = { version = "1.1", optional = true }
wincode = { version = "0.6", optional = true, features = ["derive"] }
zerocopy = { version = "0.8", optional = true, default-features = false, features = [
    "float-nightly",
    "derive",
] }
enum-ordinalize = { version = "4.4.2", optional = true }
rkyv = { version = "0.8", optional = true }
parity-scale-codec = { version = "3.7", optional = true, features = ["derive"] }
get-size2 = { version = "0.11", optional = true, features = ["derive"] }
bevy_reflect = { version = "0.20", optional = true }


# css = ["dep:lightningcss"]
[build-dependencies]
mirl_build_tools = { version = "0.0.0-alpha" }
[lints]
workspace = true
